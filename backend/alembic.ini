[alembic]
# path to migration scripts
script_location = alembic

# database url (overridden by runtime settings)
sqlalchemy.url = sqlite:///./ai-accountant.db

# version location
version_locations = alembic/versions

[post_write_hooks]
# hooks run after writing a new migration script
hooks = my_hook

my_hook = alembic.autogenerate.hooks.update_imports

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
